<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
     href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">


    <title>Document</title>
</head>
<body>
    <!--container-fluid: stretches to fill the full width of the screen-->
    <div class="container-fluid bg-primary text-white p-4">
        <h1>My Hobby Hub</h1>
        <p>A page about the things i love to do!</p>
    </div>

    <!--container: keeps content centered and neat on the page-->
    <div class="container">

        <!-- bg-success: green background, white text -->
         <div class="bg-success text-white text p-3 my-3">
            <h2>Reading</h2>
            <p> i love reading adventure stories and discovering  new facts every day.</p>
         </div>

        <!-- bg-warning: yellow background with a dark border -->
        <div class="bg-warning border border-dark p-3 my-3">
            <h2>Drawing</h2>
            <p> I love drawing and making my own comic strips.</p>
        </div>

        <!-- bg-danger: teal background with a dark border -->
        <div class="bg-danger text-white p-3 my-3">
            <h2>Sports</h2>
            <p> I love playing basketball and going for runs in the park.</p>
        </div>

    </div>

    <!-- container-fluid footer: full-width dark bar at the bottom -->
    <div class="container-fluid bg-dark text-white p-3">
        <p>Made with Bootstrap - My Hobby Hub</p>
</body>
</html>
